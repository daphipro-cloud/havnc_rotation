[program:Xvnc]
command=bash -c 'password_file=/root/.config/tigervnc/passwd
  echo -n "$(jq --raw-output .password /data/options.json)" | vncpasswd -f > "$password_file"
  exec Xvnc "$DISPLAY" -geometry "$(jq --raw-output ".resolution // \"768x1024\"" /data/options.json)" -depth 24 -rfbport 5900 -localhost -SecurityTypes VncAuth -PasswordFile "$password_file" +extension RANDR'
priority=1
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/1
stderr_logfile_maxbytes=0

