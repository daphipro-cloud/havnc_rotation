[program:Xvfb]
command=bash -c 'resolution=$(jq --raw-output ".resolution // \"768x1024\"" /data/options.json)
  if [[ ! "$resolution" =~ ^[1-9][0-9]*x[1-9][0-9]*$ ]]; then
    echo "Invalid Xvfb resolution: $resolution" >&2
    exit 1
  fi
  IFS=x read -r width height <<< "$resolution"
  if (( width > height )); then max_dimension=$width; else max_dimension=$height; fi
  exec Xvfb "$DISPLAY" -screen 0 "${max_dimension}x${max_dimension}x24" -nolisten unix +extension RANDR'
priority=1
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/1
stderr_logfile_maxbytes=0
